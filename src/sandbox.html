<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>nuBond example</title>
    <style>
      /* Base look of every live example. Kept small on purpose: an example should look like */
      /* plain HTML with sensible defaults, so the CSS written in the example is what matters. */
      :root {
          color-scheme: light;
          --fg: #1f2328;
          --muted: #59636e;
          --bg: #ffffff;
          --surface: #f6f8fa;
          --border: #d1d9e0;
          --accent: #0b7a5a;
          --accent-fg: #ffffff;
      }

      :root[data-theme="dark"] {
          color-scheme: dark;
          --fg: #e6edf3;
          --muted: #9198a1;
          --bg: #0d1117;
          --surface: #151b23;
          --border: #2f3742;
          --accent: #3fc495;
          --accent-fg: #06150f;
      }

      html {
          background: var(--bg);
          color: var(--fg);
          font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      body {
          margin: 0;
          padding: 14px 16px;
      }

      h1, h2, h3, h4 { margin: 0 0 8px; line-height: 1.25; }
      h1 { font-size: 1.5rem; }
      h2 { font-size: 1.25rem; }
      h3 { font-size: 1.1rem; }
      p { margin: 0 0 8px; }
      ul, ol { margin: 0 0 8px; padding-left: 22px; }
      small { color: var(--muted); }
      code { font: 0.9em ui-monospace, SFMono-Regular, Consolas, monospace; background: var(--surface); padding: 1px 4px; border-radius: 4px; }
      a { color: var(--accent); }

      button, input, select, textarea {
          font: inherit;
          color: inherit;
      }

      button {
          padding: 4px 12px;
          margin: 0 4px 4px 0;
          border: 1px solid var(--border);
          border-radius: 6px;
          background: var(--surface);
          cursor: pointer;
      }

      button:hover { border-color: var(--accent); }
      button:disabled { opacity: .5; cursor: default; }

      input:not([type=checkbox]):not([type=radio]):not([type=range]), select, textarea {
          padding: 4px 8px;
          margin: 0 4px 4px 0;
          border: 1px solid var(--border);
          border-radius: 6px;
          background: var(--bg);
      }

      label { margin-right: 8px; }
    </style>
    <script type="module" src="./sandbox.ts"></script>
  </head>
  <body></body>
</html>
