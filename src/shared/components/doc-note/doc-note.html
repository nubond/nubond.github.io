<aside class="note" nb-class="this.kind">
    <span class="icon" nb-switch="this.kind">
        <span nb-case="@tip" nb-template="@icon-tip"></span>
        <span nb-case="@warn" nb-template="@icon-warn"></span>
        <span nb-default nb-template="@icon-info"></span>
    </span>
    <div class="body" nb-project-to></div>
</aside>
