<div class="editor">
    <pre class="code" aria-hidden="true"><code nb-html="highlight(this.code, this.lang) + '\n'"></code></pre>
    <textarea spellcheck="false" autocapitalize="off" autocomplete="off" wrap="off"
              nb-attr:aria-label="this.name"
              nb-bound="this.attach(nativeElement)"
              nb-event:input="this.onInput()"
              nb-event:keydown="this.onKeyDown(event)"></textarea>
</div>
